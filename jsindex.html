<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>JavaScript Görsel Ödevi</title>
    <link rel="stylesheet" href="jsstyle.css">
</head>

<body>

    <div class="container">
        <h1>JavaScript Görsel Ödevi</h1>

        <div class="main-image-container">
            <img id="randomImage" src="../img/js_gorseller/js1.png" alt="Rastgele Görsel">
        </div>



        <div class="resimdizin">
            <div class="kutu">
                <div class="button-group">
                    <button onclick="document.getElementById('resim1').style.opacity='0'">Gizle</button>
                    <button onclick="document.getElementById('resim1').style.opacity='1'">Göster</button>
                </div>
                <img id="resim1" src="../img/js_gorseller/resim1.jpg">
            </div>

            <div class="kutu">
                <div class="button-group">
                    <button onclick="document.getElementById('resim2').style.opacity='0'">Gizle</button>
                    <button onclick="document.getElementById('resim2').style.opacity='1'">Göster</button>
                </div>
                <img id="resim2" src="../img/js_gorseller/resim2.jpg">
            </div>

            <div class="kutu">
                <div class="button-group">
                    <button onclick="document.getElementById('resim3').style.opacity='0'">Gizle</button>
                    <button onclick="document.getElementById('resim3').style.opacity='1'">Göster</button>
                </div>
                <img id="resim3" src="../img/js_gorseller/resim3.jpg">
            </div>
        </div>

        <script>
            var resimler = [
                'resim1.jpg',
                'resim2.jpg',
                'resim3.jpg',
                'resim4.jpg',
                'resim5.jpg',
                'resim6.jpg',
                'resim7.jpg',
                'resim8.jpg',
                'resim9.jpg',
                'resim10.jpg'
            ];

            function rastgeleSayi255() {
                return Math.floor(Math.random() * 256);
            }
            function rastgeleRenk() {
                var r = rastgeleSayi255();
                var g = rastgeleSayi255();
                var b = rastgeleSayi255();

                return "rgba(" + r + "," + g + "," + b + ", 0.2)";
            }

            function rastgeleResimVeRenkGoster() {
                var index = Math.floor(Math.random() * resimler.length);
                document.getElementById("randomImage").src = resimler[index];
                document.body.style.backgroundColor = "#0f172a";
                document.querySelector(".container").style.backgroundColor = rastgeleRenk();
            }


            window.onload = rastgeleResimVeRenkGoster;
        </script>
</body>


</html>
