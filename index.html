<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> İrem Saral</title>

  <style>
  
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f7f8fa, #e3e9f0);
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

   
    h1 {
      margin-top: 80px;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      color: #333;
    }

 
    .link-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 400px;
    }

  
    a {
      text-decoration: none;
      color: #222;
      background: #fff;
      border: 1px solid #ccc;
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
      font-size: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    
    a:hover {
      background: #0078d4;
      color: white;
      border-color: #0078d4;
      transform: translateY(-2px);
    }

   
    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
