<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animasyon Ödevi - İrem Nur Saral</title>
    <link rel="stylesheet" href="animasyonstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>Ödev</h1>
    </header>

    <main class="container">
        <div class="card">
            <h2 class="section-title">Animasyonlu Hareketli Yüzler</h2>

            <div class="animation-area">
                <div class="yuz yuz-bounce bg-yellow">
                    <span class="emoji">😀</span>
                </div>

                <div class="yuz yuz-pulse bg-red">
                    <span class="emoji">😠</span>
                </div>

                <div class="yuz yuz-fade bg-blue">
                    <span class="emoji">😮</span>
                </div>

                <div class="yuz yuz-slide bg-green">
                    <span class="emoji">😐</span>
                </div>

                <div class="yuz yuz-spin bg-orange">
                    <span class="emoji">😎</span>
                </div>
            </div>

            <div style="margin-top: 100px;">
                <a href="../index.html" class="p-button">Ana Menüye Dön</a>
            </div>
        </div>
    </main>

    <footer>
        <p>İrem Nur Saral | Hacettepe BÖTE</p>
    </footer>

</body>

</html>
